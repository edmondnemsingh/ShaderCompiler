# Build for this unofficial fork (ShaderCompiler). Upstream's build.yml only builds release tags here and expects
# SCSKiller's own runners; this one builds every push and pull request on a GitHub-hosted Windows runner and keeps
# the unsigned output as an artifact. Mirrors build.yml's Windows steps.
name: Fork build

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    if: github.repository != 'BlueHeisenberg/SCSKiller'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Proxy (CMake, MSVC, Release x64)
        shell: cmd
        run: cmake -S proxy -B proxy/build -A x64 && cmake --build proxy/build --config Release -- /m

      - name: Build
        run: dotnet build SCSKiller.slnx -c Release

      # No Oodle DLL in the output (THIRD-PARTY-NOTICES.md); nothing is signed.
      - name: Publish
        shell: powershell
        run: ./build/publish.ps1 -NoOodle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: ShaderCompiler-windows-unsigned
          path: dist/
          retention-days: 14
          if-no-files-found: error
